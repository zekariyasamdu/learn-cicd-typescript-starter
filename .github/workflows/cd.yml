name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: deploy
    runs-on: ubuntu-latest

    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: setup node
        uses: actions/setup-node@v5
        with:
          version: 22

      - name: install dependencies
        run: npm ci

      - name: build
        run: npm run build
